# ==============================================================================
# Configuracion de Analisis Estatico y Calidad con SonarQube / SonarCloud (IE5)
# ==============================================================================
sonar.projectKey=sewa2112_Pagos-svc
sonar.projectName=Pagos | Microservicio Pagos (caso06 - ViajaMejor)
sonar.projectVersion=1.0.0

# Codificacion y fuentes
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Integracion de Reportes de Cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusiones de analisis
sonar.exclusions=**/*Application.java,**/config/**
sonar.coverage.exclusions=**/*Application.java,**/config/**

# Politica de Calidad (Quality Gate)
sonar.qualitygate.wait=true
