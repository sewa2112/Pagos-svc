apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pagos-svc-hpa
  namespace: pagos-system
  labels:
    app: pagos-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pagos-svc
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

