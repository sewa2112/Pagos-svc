apiVersion: v1
kind: Service
metadata:
  name: pagos-svc
  namespace: pagos-system
  labels:
    app: pagos-svc
    app.kubernetes.io/name: pagos-svc
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: pagos-svc
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
